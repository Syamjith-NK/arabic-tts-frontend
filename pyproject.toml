[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-tts-frontend"
version = "0.1.0"
description = "Make Arabic text speakable: numeral verbalisation, a pronunciation lexicon, and lexicon-first diacritisation, in front of any TTS engine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Syamjith NK", email = "hello@syamjithnk.com" }]
keywords = ["arabic", "tts", "text-normalization", "numerals", "diacritization", "nlp", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Syamjith-nk/arabic-tts-frontend"
Issues = "https://github.com/Syamjith-nk/arabic-tts-frontend/issues"

[project.scripts]
arabic-tts-frontend = "arabic_tts_frontend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arabic_tts_frontend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
